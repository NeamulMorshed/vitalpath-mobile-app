name: vitalpath
description: VitalPath — Patient health companion mobile app.
version: 2.0.0+6

publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ─────────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Local persistence ─────────────────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # ── Utilities ─────────────────────────────────────────────────────────────────
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.3

  # ── Media ─────────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Security ───────────────────────────────────────────────────────────────────
  local_auth: ^2.3.0              # Biometric / device-credential auth gate
  flutter_secure_storage: ^9.2.2  # Hardware-backed Keychain/Keystore for AES key
  encrypt: ^5.0.3                 # AES-256-CBC field-level encryption

  # ── Native integrations ───────────────────────────────────────────────────────
  # These require platform-side configuration before enabling.
  # See the integration guide in CLAUDE.md for setup steps.
  #
  # Firebase — run `flutterfire configure` first:
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.4
  firebase_auth: ^5.4.0
  google_sign_in: ^6.2.2        # Google OAuth — enable in Firebase Console first
  #
  # GPS / Maps — add API keys to AndroidManifest.xml and AppDelegate.swift:
  #   geolocator: ^12.0.0
  #   google_maps_flutter: ^2.7.0
  #
  # QR scanning:
  #   mobile_scanner: ^6.0.2
  #
  # HealthKit / Health Connect — add entitlements in Xcode:
  #   health: ^10.2.0
  #
  # Push notifications — add google-services.json / GoogleService-Info.plist:
  #   flutter_local_notifications: ^17.2.3
  #   timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
